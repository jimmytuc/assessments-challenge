server {
    listen 80;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location = /status {
        proxy_pass http://api:3000/status;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }

}
