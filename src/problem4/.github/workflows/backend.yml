name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: backend
  APP_NAME: backend
  DEPLOYMENT_GROUP: backend-asg
  S3_DEPLOY_BUCKET: ${{ vars.BACKEND_DEPLOY_BUCKET }}
  ALB_ENDPOINT: ${{ vars.BACKEND_ALB_ENDPOINT }}

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint --if-present
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

  build:
    name: build + scan + push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

      - name: Build image
        run: |
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:latest" || true
          docker build \
            --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            backend
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

      - name: Scan image (Trivy, fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

      - name: Push image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  deploy-staging:
    name: deploy staging
    needs: build
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (rolls back internally on failure)
        run: |
          scripts/deploy-backend.sh "$APP_NAME" "$DEPLOYMENT_GROUP" "$AWS_REGION"
        env:
          IMAGE_TAG: ${{ github.sha }}
          S3_DEPLOY_BUCKET: ${{ vars.BACKEND_DEPLOY_BUCKET }}
          ALB_ENDPOINT: ${{ vars.BACKEND_ALB_ENDPOINT }}

  deploy-production:
    name: deploy production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (rolls back internally on failure)
        run: |
          scripts/deploy-backend.sh "$APP_NAME" "$DEPLOYMENT_GROUP" "$AWS_REGION"
        env:
          IMAGE_TAG: ${{ github.sha }}
          S3_DEPLOY_BUCKET: ${{ vars.BACKEND_DEPLOY_BUCKET }}
          ALB_ENDPOINT: ${{ vars.BACKEND_ALB_ENDPOINT }}
